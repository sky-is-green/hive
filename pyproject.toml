[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivebench"
version = "0.2.0"
description = "Hive — engine-agnostic GGUF serving, cascade, and evaluation harness"
readme = "hivebench/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
# The base install is serve-only: the `hive` CLI, backend fetch, GGUF
# discovery/download, model lifecycle and the memory guard.  The Studio and
# the evaluation suite are opt-in extras so a serving box does not pull in
# FastAPI, pytest, datasets or accelerate.
dependencies = [
    "huggingface_hub>=0.24",
    "requests>=2.28",
    "psutil>=5.9",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]
eval = [
    "accelerate>=1.1.0",
    "datasets>=3.0",
    "numpy>=1.26",
]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "httpx>=0.28",
]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "accelerate>=1.1.0",
    "datasets>=3.0",
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "httpx>=0.28",
]

[project.scripts]
hive = "harness.cli:main"
hivebench = "experiments.generate_data:main"
hivebench-protocol = "experiments.run_p1_p10:main"
hivebench-probe = "experiments.model_probe:main"
hivebench-diagnostic = "experiments.retrieval_diagnostic:main"
hivebench-gate-ab = "experiments.confirmation_gate_ab:main"
hivebench-compare = "experiments.run_compare:main"
hivebench-ab = "experiments.paired_ab:main"
hivebench-ternary = "experiments.ternary_eval:main"
hivebench-harness = "harness.__main__:main"

# All package roots live at the repo top level, flat import names preserved:
#   experiments/ -> data generation, probes, A/B batteries, finetune runs
#   testing/     -> ablation / AB test tooling
#   tests/       -> unit + integration suite for the splinter system
#   harness/     -> the HiveBench Studio sidecar (python -m harness)
# vendor/deepseek_harness (vendored dsh SDK) is not an installed package;
# harness/agent.py adds it to sys.path relative to this repo root.
# The system under test (`splinter` — cortex, sieve, membrane, ...) lives in
# the absorbed ./splinter project (its own pyproject.toml).
[tool.setuptools.packages.find]
where = ["."]
include = ["experiments*", "testing*", "tests*", "harness*"]

[tool.setuptools.package-data]
# The backend manifest is read-only source data; the checkout copy under
# tools/backends still wins when one is present.
harness = ["data/*.json"]
