[package]
name = "hive-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive-memory"
path = "src/main.rs"

[features]
default = ["native-encoder"]
native-encoder = ["dep:hive-encoder"]

[dependencies]
chrono.workspace = true
encoding_rs = "0.8"
clap.workspace = true
hive-core = { path = "../hive-core" }
hive-encoder = { path = "../hive-encoder", optional = true }
md5 = "0.7"
regex = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
