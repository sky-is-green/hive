[package]
name = "hive-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hive-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
hive-core = { path = "../hive-core" }
hive-memory = { path = "../hive-memory", default-features = false }
hive-models = { path = "../hive-models" }
hive-supervisor = { path = "../hive-supervisor" }
http = "1"
libc.workspace = true
mime_guess = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "sync", "time", "fs"] }
ureq = "2"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
