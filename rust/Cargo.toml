[workspace]
resolver = "3"
members = [
    "crates/hive-core",
    "crates/hive-state",
    "crates/hive-models",
    "crates/hive-supervisor",
    "crates/hive-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
