# Hive sandboxed subagents (managed by deploy/hive-sandbox/install.sh).
#
# The parent keeps the base sandbox and the full tool set.  The child preset
# mounts only the Docker-backed bash tool; /v1/sandbox/exec validates the
# child's workspace, mounts it at /workspace, and runs the pinned image with no
# network, no host home, no Hive state, and hive.session/hive.parent labels.

- id: tool-subagent
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: hive-sandbox

    - id: preset-hive-sandbox
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hive-sandbox
        name: Hive sandbox
        description: Docker-backed bash child with only its workspace mounted.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a sandboxed subagent. The workspace is mounted at
                /workspace and is the only writable host path. There is no
                network, no host home, and no Hive state. Use the bash tool for
                all file work. Check the [exit code: N] marker on every result,
                then report the result.
              complete: true
          - id: tool-bash-docker
            name: '@deepseek-ai/hive-docker-bash'
            config:
              endpoint: http://127.0.0.1:8765/v1/sandbox/exec

    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: hive-delegate-tool
      name: '@deepseek-ai/hive-delegate'
      inject: [agentPresets, subagents]
      config:
        provider: spawn
        toolName: delegate
        agentPreset: hive-sandbox
        maxDepth: 1
